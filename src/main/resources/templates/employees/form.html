
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Employee Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 35px;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 28px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #243b64;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #2459a9;
            border-color: #2459a9;
        }

        input.invalid {
            border-color: #c62828;
        }

        .field-error {
            color: #c62828;
            font-size: 13px;
            margin-top: 5px;
        }

        .error-summary {
            color: #842029;
            background: #f8d7da;
            border: 1px solid #f5c2c7;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .actions {
            margin-top: 22px;
        }

        button,
        .cancel {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        button {
            background: #2459a9;
            color: white;
        }

        button:hover {
            background: #193f7a;
        }

        .cancel {
            background: #ddd;
            color: #222;
            margin-left: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2 th:text="${pageTitle}">Employee Form</h2>

    <form th:action="@{/employees/save}"
          th:object="${employee}"
          method="post">

        <!-- Validation summary -->
        <div class="error-summary"
             th:if="${#fields.hasAnyErrors()}">
            Please correct the errors below before saving.
        </div>

        <!-- Employee ID: used when editing -->
        <input type="hidden" th:field="*{id}">

        <!-- Name -->
        <label for="name">Employee Name</label>
        <input type="text"
               id="name"
               th:field="*{name}"
               th:errorclass="invalid"
               maxlength="100"
               required>

        <div class="field-error"
             th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}">
        </div>

        <!-- Department -->
        <label for="department">Department</label>
        <input type="text"
               id="department"
               th:field="*{department}"
               th:errorclass="invalid"
               maxlength="100"
               required>

        <div class="field-error"
             th:if="${#fields.hasErrors('department')}"
             th:errors="*{department}">
        </div>

        <!-- Designation -->
        <label for="designation">Designation</label>
        <input type="text"
               id="designation"
               th:field="*{designation}"
               th:errorclass="invalid"
               maxlength="100"
               required>

        <div class="field-error"
             th:if="${#fields.hasErrors('designation')}"
             th:errors="*{designation}">
        </div>

        <!-- Salary -->
        <label for="salary">Salary</label>
        <input type="number"
               id="salary"
               th:field="*{salary}"
               th:errorclass="invalid"
               min="0"
               max="99999999.99"
               step="0.01"
               required>

        <div class="field-error"
             th:if="${#fields.hasErrors('salary')}"
             th:errors="*{salary}">
        </div>

        <!-- Buttons -->
        <div class="actions">
            <button type="submit">Save Employee</button>
            <a class="cancel" th:href="@{/employees}">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
